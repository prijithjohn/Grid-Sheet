name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Package Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify analysis & tests before release
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build Windows Desktop Release
        run: flutter build windows --release

      - name: Package Windows Release Archive
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          $zipPath = "grid-sheet-windows-${{ github.ref_name }}.zip"
          Compress-Archive -Path "$releaseDir/*" -DestinationPath $zipPath -Force
          $hash = (Get-FileHash -Path $zipPath -Algorithm SHA256).Hash
          "$hash  $zipPath" | Out-File -FilePath "$zipPath.sha256" -Encoding ascii
          Write-Output "Generated archive $zipPath with SHA256: $hash"

      - name: Create Draft Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          files: |
            grid-sheet-windows-${{ github.ref_name }}.zip
            grid-sheet-windows-${{ github.ref_name }}.zip.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
